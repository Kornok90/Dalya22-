<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dalya Ahmed</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#4f46e5,#7c3aed,#9333ea);
min-height:100vh;
}

/* الشريط العلوي */

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
color:white;
font-size:22px;
}

.logo{
font-weight:bold;
}

.menu-btn{
font-size:30px;
cursor:pointer;
}

/* القائمة الجانبية */

.sidebar{
position:fixed;
top:0;
right:-250px;
width:250px;
height:100%;
background:white;
padding-top:70px;
transition:.4s;
box-shadow:0 0 15px rgba(0,0,0,.2);
}

.sidebar a{
display:block;
padding:15px 25px;
text-decoration:none;
color:#333;
font-size:18px;
}

.sidebar a:hover{
background:#f3f4f6;
}

.sidebar.active{
right:0;
}

/* البطاقة */

.hero{
display:flex;
justify-content:center;
align-items:center;
height:80vh;
padding:20px;
}

.card{
background:white;
width:100%;
max-width:700px;
padding:40px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.2);
animation:fadeIn 1s;
}

.card h1{
color:#6d28d9;
font-size:45px;
margin-bottom:10px;
}

.card h2{
color:#444;
margin-bottom:20px;
}

.card p{
font-size:20px;
line-height:2;
color:#555;
}

.btn{
display:inline-block;
margin-top:25px;
background:#6d28d9;
color:white;
padding:15px 35px;
text-decoration:none;
border-radius:12px;
font-size:20px;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
background:#5b21b6;
}

.footer{
text-align:center;
color:white;
padding:20px;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="navbar">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
<div class="logo">Dalya Ahmed</div>
</div>

<div class="sidebar" id="menu">
<a href="#">الرئيسية</a>
<a href="A.html">نبذة عني</a>
<a href="#">مهاراتي</a>
<a href="#">تواصل معي</a>
</div>

<div class="hero">

<div class="card">

<h1>أهلاً بكم في موقعي</h1>

<h2>Dalya Ahmed</h2>

<p>
طالبة علوم الحاسوب بجامعة الفاشر، مهتمة بالبرمجة وتحليل البيانات والتقنيات الحديثة.
</p>

<a href="A.html" class="btn">
الدخول إلى الموقع
</a>

</div>

</div>

<div class="footer">
© 2026 Dalya Ahmed
</div>

<script>

function toggleMenu(){
document.getElementById("menu").classList.toggle("active");
}

</script>

</body>
</html>
